<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Исааку Ньютону</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="w">
  <h1> <img src="" alt=""> Исааку Ньютону</h1>
  <div class="top"><span id="num"></span><span id="sc"></span></div>
  <div class="bar"><i id="pb"></i></div>
  <div class="card" id="box"></div>
</div>
<script>
const Q=[
["Что верно об отце Ньютона?",["Он умер до рождения Ньютона","Он был известным профессором","Он отправил Ньютона в Кембридж","Он был советником короля"],0],
["В каком колледже Кембриджа учился Ньютон?",["Королевский колледж","Тринити-колледж","Баллиол-колледж","Итонский колледж"],1],
["В 1665–1666 годах Кембридж закрылся, и Ньютон вернулся домой. Почему?",["Из-за войны","Из-за пожара","Из-за эпидемии Великой чумы","Из-за указа короля"],2],
["В каком году Ньютон стал лукасовским профессором?",["1661","1687","1669","1696"],2],
["У кого Ньютон принял лукасовскую кафедру?",["Исаак Барроу","Роберт Гук","Эдмонд Галлей","Кристофер Рен"],0],
["Какой астроном убедил Ньютона издать «Начала» и оплатил издание?",["Джон Флемстид","Эдмонд Галлей","Тихо Браге","Уильям Гершель"],1],
["В каком году вышла «Оптика» Ньютона?",["1687","1668","1727","1704"],3],
["На какую должность Ньютон был назначен в 1696 году?",["Смотритель Королевского монетного двора","Премьер-министр","Глава Адмиралтейства","Верховный судья"],0],
["Кто присвоил Ньютону рыцарское звание (сэр)?",["Король Георг I","Королева Анна","Оливер Кромвель","Король Карл II"],1],
["Как Ньютон называл дифференциальное исчисление?",["Теория пределов","Метод алгоритмов","Метод флюксий","Метод логарифмов"],2],
["Что из перечисленного — вклад Ньютона в математику?",["Теорема Пифагора","Обобщённая биномиальная теорема","Великая теорема Ферма","Алгоритм Евклида"],1],
["Для чего используется метод Ньютона (Ньютона–Рафсона)?",["Для вычисления площади круга","Для приближённого поиска корней уравнений","Для измерения скорости света","Для определения массы планеты"],1],
["Расстояние между двумя телами увеличили вдвое. Как изменится сила притяжения?",["Уменьшится в 2 раза","Увеличится в 2 раза","Увеличится в 4 раза","Уменьшится в 4 раза"],3],
["Кто первым измерил гравитационную постоянную G в лаборатории?",["Галилео Галилей","Генри Кавендиш","Джеймс Максвелл","Майкл Фарадей"],1],
["Масса тела 2 кг, ускорение 3 м/с². Чему равна действующая сила?",["1,5 Н","5 Н","9 Н","6 Н"],3],
["Законы какого учёного Ньютон объяснил с помощью закона тяготения?",["Кеплера","Коперника","Архимеда","Евклида"],0],
["Какое явление демонстрируют «кольца Ньютона»?",["Интерференцию света","Эхо звука","Магнитную индукцию","Радиоактивность"],0],
["Чем, кроме физики, Ньютон много занимался?",["Живописью и музыкой","Алхимией и богословием","Спортом и навигацией","Медициной и архитектурой"],1],
["В каком году Ньютон был избран президентом Королевского общества?",["1687","1696","1727","1703"],3],
["О чём был знаменитый спор Ньютона и Лейбница?",["О природе света","О том, кто первым создал математический анализ","О числе планет","Об измерении времени"],1],
["Что означает фраза Ньютона «Hypotheses non fingo»?",["Я знаю всё","Гипотез я не измышляю","Природа останется загадкой","Математика — это всё"],1],
["Что должен был показать опыт Ньютона с вращающимся ведром?",["Плотность воды","Скорость света","Существование абсолютного пространства и вращения","Намагничивание"],2],
["Из скольких книг состоят «Начала»?",["Из 1","Из 2","Из 5","Из 3"],3],
["Что, по преданию, Ньютон мастерил в юности?",["Микроскоп и часы","Солнечные часы и модель ветряной мельницы","Модель самолёта","Паровоз"],1],
["В каком году Ньютон построил первый телескоп-рефлектор?",["1608","1704","1668","1727"],2],
["К чему относился «решающий эксперимент» (experimentum crucis) Ньютона?",["К разложению света призмой","К магнетизму и электричеству","К давлению воздуха","К теплопроводности"],0],
["О чём закон охлаждения Ньютона?",["Чем тяжелее тело, тем быстрее оно остывает","Скорость остывания пропорциональна разности температур тела и среды","Все тела остывают одинаково","Тепло переходит от холодного к горячему"],1],
["Какую теорию света отстаивал Ньютон?",["Волновую","Квантовую","Теорию относительности","Корпускулярную"],3],
["В каком возрасте умер Ньютон?",["84 года","70 лет","91 год","62 года"],0],
["В школе какого города учился Ньютон в детстве?",["Лондон","Грантем","Оксфорд","Эдинбург"],1]
];
let i=0,score=0,done=false;
const $=id=>document.getElementById(id);
function show(){
  done=false;
  const q=Q[i],box=$("box");
  $("num").textContent=`Вопрос ${i+1} / ${Q.length}`;
  $("sc").textContent=`✅ ${score}`;
  $("pb").style.width=(i/Q.length*100)+"%";
  box.innerHTML="";
  const h=document.createElement("p");h.className="q";h.textContent=q[0];box.appendChild(h);
  q[1].forEach((t,k)=>{
    const b=document.createElement("button");b.className="opt";b.textContent=t;
    b.onclick=()=>pick(k);box.appendChild(b);
  });
  const m=document.createElement("div");m.id="msg";m.className="msg";box.appendChild(m);
  const n=document.createElement("button");n.className="btn";n.id="nx";n.style.display="none";
  n.textContent=i===Q.length-1?"Посмотреть результат":"Следующий вопрос →";
  n.onclick=next;box.appendChild(n);
}
function pick(k){
  if(done)return;done=true;
  const q=Q[i],opts=document.querySelectorAll(".opt");
  opts.forEach(o=>o.disabled=true);
  if(k===q[2]){opts[k].classList.add("ok");score++;say("✅ Правильно!","ok")}
  else{opts[k].classList.add("no");opts[q[2]].classList.add("ok");say("❌ Неправильно! Верный ответ выделен зелёным.","no")}
  $("sc").textContent=`✅ ${score}`;
  $("nx").style.display="inline-block";
}
function say(t,c){const m=$("msg");m.textContent=t;m.className="msg "+c}
function next(){i++;i<Q.length?show():result()}
function result(){
  $("num").textContent="Тест завершён";$("pb").style.width="100%";
  const p=Math.round(score/Q.length*100);
  const t=p>=90?"Великолепно! Вы знаете о Ньютоне всё! 🏆":p>=70?"Очень хороший результат! 👏":p>=50?"Неплохо, попробуйте ещё раз 🙂":"Попробуйте снова — у вас обязательно получится! 💪";
  $("box").innerHTML=`<div class="res"><div class="big">${score} / ${Q.length}</div><p>${p}% правильных ответов</p><p>${t}</p><button class="btn" onclick="restart()">Начать заново</button></div>`;
}
function restart(){i=0;score=0;show()}
show();
</script>
</body>
</html>
